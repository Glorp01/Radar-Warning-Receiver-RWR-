<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F/A-18 RWR Simulator</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="cockpit">
    <div class="bezel">
      <canvas id="scope" width="600" height="600"></canvas>
      <div class="bezel-label">AN/ALR-67(V)3 &mdash; THREAT WARNING</div>
    </div>

    <div class="panel">
      <div class="panel-group">
        <button id="btnSysTest" title="Self-test: lights every symbol type">SYS TEST</button>
        <button id="btnDimBrt" title="Toggle display brightness">DIM/BRT</button>
        <button id="btnPause">PAUSE</button>
      </div>

      <div class="panel-group">
        <label>AUDIO <input type="checkbox" id="chkAudio" checked></label>
        <label>VOL <input type="range" id="rngVolume" min="0" max="1" step="0.01" value="0.6"></label>
      </div>

      <div class="panel-group">
        <select id="selThreatType"></select>
        <button id="btnAddThreat">ADD</button>
        <button id="btnClear">CLEAR</button>
      </div>

      <div class="panel-group">
        <select id="selScenario">
          <option value="">-- scenario presets --</option>
          <option value="quiet">Quiet Patrol</option>
          <option value="sam_ambush">SAM Ambush</option>
          <option value="strike_package">Strike Package (mixed IADS)</option>
        </select>
        <button id="btnLoadScenario">LOAD</button>
      </div>

      <div class="legend" id="legend"></div>
    </div>
  </div>

  <script src="js/symbols.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/threats.js"></script>
  <script src="js/display.js"></script>
  <script src="js/simulation.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
